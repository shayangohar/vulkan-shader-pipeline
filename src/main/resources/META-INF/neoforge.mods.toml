modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "chimera"
version = "${version}"
displayName = "Chimera"
description = "Shaderpack pipeline for VulkanMod - Iris-class shaders on Vulkan."
authors = "shayangohar"

[[mixins]]
config = "chimera.mixins.json"

[[dependencies.chimera]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.chimera]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "CLIENT"

# The Vulkan host renderer, VulkanMod Reforged; Chimera mixes into it, so it loads first.
# Every Chimera mixin into Reforged's internals must apply, so the range is the Reforged line
# Chimera was built and tested on. Another Reforged (0.3.0 and 0.3.5 differ in the hooks) or
# another mod with the vulkanmod id then meets NeoForge's dependency screen instead of a crash at
# launch.
[[dependencies.chimera]]
modId = "vulkanmod"
type = "required"
versionRange = "[0.3.5-ALPHA,0.3.6)"
ordering = "AFTER"
side = "CLIENT"
