shadowMapResolution=1024
shadowDistance=192
shadowDistanceRenderMul=1.25
sunPathRotation=35
sunPathOffset=4

# The shadow program reads a fade the pack authors itself, written the way BSL writes one, so the
# catalog does not answer for it.
uniform.float.shadowFade = 1.0 - shadowFadeOut + shadowFadeIn
variable.float.shadowFadeOut = clamp((worldTime - 12330) / 230, 0.0, 1.0)
variable.float.shadowFadeIn = clamp((worldTime - 13010) / 220, 0.0, 1.0)
