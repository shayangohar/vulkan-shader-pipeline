uniform.float.m73Marker = m73Factor + rainStrength
variable.float.m73Factor = frameTimeCounter > 0.0 ? 2.0 : 1.0
variable.float.m73CycleA = m73CycleB + 1.0
variable.float.m73CycleB = m73CycleA + 1.0
variable.float.m73Unknown = missingM73Value + 1.0

# The pack-authored language, written the way the pinned packs write it: a smoothing call with its
# half lives, a named biome constant, a component of an engine input, a math call, and a
# declaration that continues onto the next line.
uniform.float.m73Derived = smooth(7, rainStrength, 5, 5) + if(in(biome, BIOME_DESERT), 1, 0) + \
                           sqrt(9.0) + m73Continued
uniform.float.m73Component = eyeBrightness.y + cameraPosition.y
variable.float.m73Continued = max(2.0, frameTimeCounter) + 1.0

# A value that cannot be finite: the session must name it and hold a finite result, never
# substitute an invented number.
uniform.float.m73NonFinite = sqrt(0.0 - 1.0)

# Each of these is refused, and the deviation names what was wrong rather than serving a zero.
uniform.float.m73BadFunction = sinh(frameTime)
uniform.float.m73BadArity = smooth(1, 2)
uniform.float.m73BadComponent = frameTime.x
uniform.float.m73BadConstant = BIOME_NOT_A_BIOME + 1.0
