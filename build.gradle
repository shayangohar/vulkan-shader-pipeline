tasks.register('m87EntityRealPackTest', JavaExec) {
    group = 'verification'
    description = 'Checks locked-pack entity/block executability, exact target routes, and converted shader compilation.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.chimera.shaderpack.M87EntityRealPackHarness'
    jvmArgs '-ea'
    // Complete CHIMERA instance option set (see instance.cfg JvmArgs).
    // The manifest gate must see the same branch conditions as runtime;
    // a subset silently drops samplers such as MCBL lighttex/noisetex.
    systemProperty 'chimera.option.MULTICOLORED_BLOCKLIGHT', '1'
    systemProperty 'chimera.option.MCBL_DISTANCE', '128'
    systemProperty 'chimera.option.MCBL_HALF_HEIGHT', '1'
    systemProperty 'chimera.option.COLORED_LIGHTING', '128'
    systemProperty 'chimera.option.WORLD_SPACE_REFLECTIONS', '1'
    systemProperty 'chimera.option.RP_MODE', '3'
    systemProperty 'chimera.option.ADVANCED_MATERIALS', '1'
    systemProperty 'chimera.option.MATERIAL_FORMAT', '1'
    systemProperty 'chimera.option.BLOCK_REFLECT_QUALITY', '3'
    doFirst {
        ['m87EntityComplementary': 'chimera.m87.entity.complementary',
         'm87EntityBsl': 'chimera.m87.entity.bsl'].each { projectKey, systemKey ->
            def value = project.findProperty(projectKey) ?: System.getProperty(systemKey)
            if (value != null && !value.toString().isBlank()) {
                def pack = file(value.toString())
                if (!pack.isDirectory() && !pack.isFile()) {
