plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Host renderer (LGPL) - linked as a library, chimera stays MIT
    modImplementation "maven.modrinth:vulkanmod:${project.vulkanmod_version}"

    // Vulkan bindings: bundled by VulkanMod at runtime; compile-only here
    compileOnly "org.lwjgl:lwjgl-vulkan:3.3.3"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.register('conformanceTest', JavaExec) {
    group = 'verification'
    description = 'Runs the deterministic M5.1 through M5.6 shader-pack conformance harness.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.chimera.shaderpack.ConformanceHarness'
    jvmArgs '-ea'
}

tasks.named('check') {
    dependsOn tasks.named('conformanceTest')
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
