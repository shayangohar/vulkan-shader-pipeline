plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Host renderer (LGPL) - linked as a library, chimera stays MIT
    modImplementation "maven.modrinth:vulkanmod:${project.vulkanmod_version}"

    // Optional: Mod Menu's config button opens the shader pack selector
    modCompileOnly "maven.modrinth:modmenu:17.0.1-beta.1"

    // Vulkan bindings: bundled by VulkanMod at runtime; compile-only here
    compileOnly "org.lwjgl:lwjgl-vulkan:3.3.3"
    compileOnly "org.lwjgl:lwjgl-vma:3.3.3"
    compileOnly "org.lwjgl:lwjgl-shaderc:3.3.3"
    testImplementation "org.lwjgl:lwjgl-vulkan:3.3.3"
    testImplementation "org.lwjgl:lwjgl-shaderc:3.3.3"
    testRuntimeOnly "org.lwjgl:lwjgl:3.3.3:natives-windows"
    testRuntimeOnly "org.lwjgl:lwjgl-shaderc:3.3.3:natives-windows"

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.register('packReport', JavaExec) {
    group = 'help'
    description = 'Prints the offline plan report and ranked blocking reasons for -PpackReportPacks=<pack>[;<pack>...].'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.chimera.shaderpack.PackReportTool'
    systemProperty 'chimera.packReport.packs', project.findProperty('packReportPacks') ?: ''
    systemProperty 'chimera.packReport.verbose', project.findProperty('packReportVerbose') ?: 'false'
}

// Every chimera.* project property reaches the test JVM as a system property:
//   -Pchimera.pack.complementary=<zip> -Pchimera.pack.bsl=<zip>  the locked packs (packTest)
//   -Pchimera.pack.extra=<zip>;<zip>                             broadening packs for PackCompileTest
//   -Pchimera.gpu=true                                           the headless Vulkan checks
//   -Pchimera.printBaselines=true                                print what a baseline test would record
def chimeraProperties = providers.gradlePropertiesPrefixedBy('chimera.')

tasks.withType(Test).configureEach {
    // One JVM per class: plans read process-wide shader options and keep static caches.
    forkEvery = 1
    maxParallelForks = Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))
    jvmArgs '-ea', '-Dorg.lwjgl.system.stackSize=256'
    // LWJGL extracts its natives here rather than into the working directory.
    systemProperty 'org.lwjgl.system.SharedLibraryExtractPath', layout.buildDirectory.dir('lwjgl').get().asFile.path
    systemProperties chimeraProperties.get()
    inputs.properties chimeraProperties.get()
    testLogging {
        events 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

// Fixture tests: everything they read is in the repository.
tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'packs', 'evidence'
    }
}

tasks.register('packTest', Test) {
    group = 'verification'
    description = 'Runs the tests that read the locked packs: -Pchimera.pack.complementary, -Pchimera.pack.bsl.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'packs'
    }
    shouldRunAfter tasks.named('test')
}

// Recorded runtime evidence (logs, captures, exact pack versions) for past parity milestones.
// Not part of check: its baselines predate later planner work, and re-recording them is a review step.
tasks.register('evidenceTest', Test) {
    group = 'verification'
    description = 'Checks recorded runtime evidence; each test names the -Pchimera.* values it needs.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'evidence'
    }
}

// The metrics ratchet: tools/metrics/baseline.txt records each method over complexity 15 or 80
// lines, each file over 1,000 lines with its reason, duplication, inline qualified names and lines
// over 120 characters. check fails when any of them grows; metricsRecord rewrites the baseline.
sourceSets {
    metrics {
        java.srcDir 'tools/metrics'
    }
}

def metricsTask = { String name, String mode, String text ->
    tasks.register(name, JavaExec) {
        group = 'verification'
        description = text
        classpath = sourceSets.metrics.runtimeClasspath
        mainClass = 'CodeMetrics'
        args mode, 'tools/metrics/baseline.txt', 'src/main/java', 'src/test/java', 'tools/metrics'
    }
}
metricsTask('metricsCheck', 'check', 'Fails when the sources regress past tools/metrics/baseline.txt.')
metricsTask('metricsRecord', 'record', 'Rewrites tools/metrics/baseline.txt from the sources, keeping file reasons.')

tasks.named('check') {
    dependsOn tasks.named('packTest')
    dependsOn tasks.named('metricsCheck')
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Every lint is an error, so warnings cannot accumulate. Three lints stay off because they are
// not about this code: classfile (gson's classes cite error-prone annotations that are not on
// the classpath), processing (Mixin's annotation processor) and serial (internal exceptions
// are never serialized).
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:all', '-Xlint:-classfile', '-Xlint:-processing', '-Xlint:-serial', '-Werror']
}
