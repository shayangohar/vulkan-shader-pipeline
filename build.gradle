            (project.findProperty('m85Baseline') ?: file('testpacks/baselines/m8_5.json')).toString()
    doFirst {
        ['m85Complementary', 'm85Bsl'].each { key ->
            def value = project.findProperty(key)
            if (value != null && !value.toString().isBlank()) {
                def pack = file(value.toString())
                if (!pack.isDirectory() && !pack.isFile()) {
                    throw new GradleException("M8.5 pack path does not exist: ${pack}")
                }
                systemProperty key == 'm85Complementary'
