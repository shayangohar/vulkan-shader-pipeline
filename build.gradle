plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Host renderer (LGPL) - linked as a library, chimera stays MIT
    modImplementation "maven.modrinth:vulkanmod:${project.vulkanmod_version}"

    // Vulkan bindings: bundled by VulkanMod at runtime; compile-only here
    compileOnly "org.lwjgl:lwjgl-vulkan:3.3.3"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.register('conformanceTest', JavaExec) {
    group = 'verification'
    description = 'Runs deterministic M5.1 through M5.6 fixtures and post-state checks.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.chimera.shaderpack.ConformanceHarness'
    jvmArgs '-ea'
}

tasks.register('m61ConformanceTest', JavaExec) {
    group = 'verification'
    description = 'Runs strict M6.1 shared-plan checks against two explicitly supplied shader packs.'
    dependsOn tasks.named('conformanceTest')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.chimera.shaderpack.M61ConformanceHarness'
    jvmArgs '-ea'
    doFirst {
        def requiredPack = { String projectKey, String systemKey ->
            def value = project.findProperty(projectKey) ?: System.getProperty(systemKey)
            if (value == null || value.toString().isBlank()) {
                throw new GradleException("Missing required pack path. Set -P${projectKey} or -D${systemKey}.")
            }
            def pack = file(value.toString())
            if (!pack.isDirectory() && !pack.isFile()) {
                throw new GradleException("M6.1 pack path does not exist: ${pack}")
            }
            return pack.absolutePath
        }
        def requiredVersion = { String projectKey, String systemKey ->
            def value = project.findProperty(projectKey) ?: System.getProperty(systemKey)
            if (value == null || value.toString().isBlank()) {
                throw new GradleException("Missing required pack version. Set -P${projectKey} or -D${systemKey}.")
            }
            return value.toString()
        }
        def baselineValue = project.findProperty('m61Baseline')
                ?: System.getProperty('chimera.m61.baseline')
                ?: file('testpacks/baselines/m6_1.json').absolutePath
        def baseline = file(baselineValue.toString())
        if (!baseline.isFile()) {
            throw new GradleException("M6.1 baseline does not exist: ${baseline}")
        }
        systemProperty 'chimera.m61.complementary',
                requiredPack('m61Complementary', 'chimera.m61.complementary')
        systemProperty 'chimera.m61.independent',
                requiredPack('m61Independent', 'chimera.m61.independent')
        systemProperty 'chimera.m61.complementaryVersion',
                requiredVersion('m61ComplementaryVersion', 'chimera.m61.complementaryVersion')
        systemProperty 'chimera.m61.independentVersion',
                requiredVersion('m61IndependentVersion', 'chimera.m61.independentVersion')
        systemProperty 'chimera.m61.baseline', baseline.absolutePath
    }
}

tasks.register('m57ConformanceTest', JavaExec) {
    group = 'verification'
    description = 'Runs strict M5.7 conformance against two explicitly supplied shader packs.'
    dependsOn tasks.named('conformanceTest')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.chimera.shaderpack.M57ConformanceHarness'
    jvmArgs '-ea'
    doFirst {
        def requiredPack = { String projectKey, String systemKey ->
            def value = project.findProperty(projectKey) ?: System.getProperty(systemKey)
            if (value == null || value.toString().isBlank()) {
                throw new GradleException("Missing required pack path. Set -P${projectKey} or -D${systemKey}.")
            }
            def pack = file(value.toString())
            if (!pack.isDirectory() && !pack.isFile()) {
                throw new GradleException("M5.7 pack path does not exist: ${pack}")
            }
            return pack.absolutePath
        }
        def requiredVersion = { String projectKey, String systemKey ->
            def value = project.findProperty(projectKey) ?: System.getProperty(systemKey)
            if (value == null || value.toString().isBlank()) {
                throw new GradleException("Missing required pack version. Set -P${projectKey} or -D${systemKey}.")
            }
            return value.toString()
        }
        def baselineValue = project.findProperty('m57Baseline')
                ?: System.getProperty('chimera.m57.baseline')
                ?: file('testpacks/baselines/m5_7.json').absolutePath
        def baseline = file(baselineValue.toString())
        if (!baseline.isFile()) {
            throw new GradleException("M5.7 baseline does not exist: ${baseline}")
        }
        systemProperty 'chimera.m57.complementary',
                requiredPack('m57Complementary', 'chimera.m57.complementary')
        systemProperty 'chimera.m57.independent',
                requiredPack('m57Independent', 'chimera.m57.independent')
        systemProperty 'chimera.m57.complementaryVersion',
                requiredVersion('m57ComplementaryVersion', 'chimera.m57.complementaryVersion')
        systemProperty 'chimera.m57.independentVersion',
                requiredVersion('m57IndependentVersion', 'chimera.m57.independentVersion')
        systemProperty 'chimera.m57.baseline', baseline.absolutePath
        if (project.findProperty('m57EmitBaseline')?.toString()?.toBoolean()) {
            systemProperty 'chimera.m57.emitBaseline', 'true'
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('conformanceTest')
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
